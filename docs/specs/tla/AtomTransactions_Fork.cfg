SPECIFICATION Spec

CONSTANTS
    SOURCES = {"srcA", "srcB"}
    OWNERS = {"owner1", "owner2"}
    LABELS = {"mylib"}
    VERSIONS = {"v1.0", "v2.0"}
    KEYS = {"key1", "key2"}
    DIGESTS = {"dig1"}
    SRCS = {"src1"}
    MAX_CLOCK = 5

    \* Fork scenario: both sources share the same anchor
    SourceAnchor <- MC_ForkAnchor

\* AtomIdPerSourceUnique and IdentityStability are retired here (see
\* tla/AtomTransactions.tla, 2026-08-05) -- their pair-doctrine form was
\* vacuous, and their corrected (czd) form is either false on states this
\* model deliberately allows (fork claims legitimately differ in
\* identity) or requires claim-replacement modeling this file doesn't
\* have. Pending an architect decision on extending the model.
INVARIANTS
    PublishClaimCoherence
    NoUnclaimedPublish
    NoDuplicateVersion
    SessionOrdering
    NoBackdatedPublish
    PublishChainsClaim

CHECK_DEADLOCK TRUE
